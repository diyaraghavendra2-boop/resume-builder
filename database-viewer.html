<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Database Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #64748b;
            font-weight: 500;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .data-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .section-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .section-content {
            padding: 20px;
        }
        
        .user-card, .resume-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        
        .user-card:hover, .resume-card:hover {
            border-color: #6366f1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.1);
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .user-name {
            font-weight: 600;
            color: #1e293b;
        }
        
        .user-email {
            color: #6366f1;
            font-size: 14px;
        }
        
        .user-meta {
            font-size: 12px;
            color: #64748b;
        }
        
        .resume-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .resume-owner {
            color: #6366f1;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .resume-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .resume-preview {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #475569;
        }
        
        .json-viewer {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .filter-input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗄️ MongoDB Database Viewer</h1>
            <p>View and manage all resume data stored in MongoDB</p>
        </div>

        <div id="messageContainer"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalResumes">-</div>
                <div class="stat-label">Total Resumes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="publicResumes">-</div>
                <div class="stat-label">Public Resumes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lastUpdated">-</div>
                <div class="stat-label">Last Updated</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="loadAllData()" class="btn btn-primary">🔄 Refresh Data</button>
            <button onclick="exportAllData()" class="btn btn-secondary">📤 Export All</button>
            <button onclick="toggleView('users')" class="btn btn-secondary">👥 Users</button>
            <button onclick="toggleView('resumes')" class="btn btn-secondary">📋 Resumes</button>
            <button onclick="toggleView('raw')" class="btn btn-secondary">🔧 Raw JSON</button>
            <input type="text" id="searchInput" placeholder="Search..." class="filter-input" onkeyup="filterData()">
        </div>

        <div id="usersSection" class="data-section">
            <div class="section-header">
                <div class="section-title">👥 Users</div>
                <span id="usersCount">0 users</span>
            </div>
            <div class="section-content" id="usersContent">
                <div class="loading">Loading users...</div>
            </div>
        </div>

        <div id="resumesSection" class="data-section">
            <div class="section-header">
                <div class="section-title">📋 Resumes</div>
                <span id="resumesCount">0 resumes</span>
            </div>
            <div class="section-content" id="resumesContent">
                <div class="loading">Loading resumes...</div>
            </div>
        </div>

        <div id="rawSection" class="data-section hidden">
            <div class="section-header">
                <div class="section-title">🔧 Raw JSON Data</div>
                <button onclick="copyRawData()" class="btn btn-secondary">📋 Copy</button>
            </div>
            <div class="section-content">
                <div class="json-viewer" id="rawDataViewer">
                    Loading raw data...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/api';
        let allUsers = [];
        let allResumes = [];
        let rawData = {};

        async function loadAllData() {
            try {
                showMessage('Loading data from MongoDB...', 'info');
                
                // Load users (this would need an admin endpoint)
                await loadUsers();
                
                // Load all resumes (this would need an admin endpoint)
                await loadResumes();
                
                updateStats();
                showMessage('✅ Data loaded successfully!', 'success');
            } catch (error) {
                showMessage(`❌ Failed to load data: ${error.message}`, 'error');
            }
        }

        async function loadUsers() {
            // Note: This would need an admin endpoint in the backend
            // For now, we'll simulate with the current user
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    throw new Error('Please login first');
                }

                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success) {
                    allUsers = [data.data.user]; // Only current user for now
                    renderUsers();
                }
            } catch (error) {
                console.error('Failed to load users:', error);
                document.getElementById('usersContent').innerHTML = `
                    <div class="error">Failed to load users. Please login first.</div>
                `;
            }
        }

        async function loadResumes() {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    throw new Error('Please login first');
                }

                const response = await fetch(`${API_BASE}/resume`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success) {
                    allResumes = data.data.resumes;
                    renderResumes();
                    
                    rawData = {
                        users: allUsers,
                        resumes: allResumes,
                        metadata: {
                            totalUsers: allUsers.length,
                            totalResumes: allResumes.length,
                            publicResumes: allResumes.filter(r => r.isPublic).length,
                            lastUpdated: new Date().toISOString()
                        }
                    };
                    renderRawData();
                }
            } catch (error) {
                console.error('Failed to load resumes:', error);
                document.getElementById('resumesContent').innerHTML = `
                    <div class="error">Failed to load resumes: ${error.message}</div>
                `;
            }
        }

        function renderUsers() {
            const container = document.getElementById('usersContent');
            document.getElementById('usersCount').textContent = `${allUsers.length} users`;

            if (allUsers.length === 0) {
                container.innerHTML = '<div class="loading">No users found</div>';
                return;
            }

            container.innerHTML = allUsers.map(user => `
                <div class="user-card">
                    <div class="user-info">
                        <div>
                            <div class="user-name">${user.name}</div>
                            <div class="user-email">${user.email}</div>
                        </div>
                        <div class="user-meta">
                            ID: ${user.id}<br>
                            Joined: ${new Date(user.createdAt).toLocaleDateString()}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderResumes() {
            const container = document.getElementById('resumesContent');
            document.getElementById('resumesCount').textContent = `${allResumes.length} resumes`;

            if (allResumes.length === 0) {
                container.innerHTML = '<div class="loading">No resumes found</div>';
                return;
            }

            container.innerHTML = allResumes.map(resume => `
                <div class="resume-card">
                    <div class="resume-title">${resume.title || 'Untitled Resume'}</div>
                    <div class="resume-owner">Owner: ${resume.userId}</div>
                    <div class="resume-meta">
                        <span>Created: ${new Date(resume.createdAt).toLocaleDateString()}</span>
                        <span>Updated: ${new Date(resume.updatedAt).toLocaleDateString()}</span>
                        <span>${resume.isPublic ? '🌐 Public' : '🔒 Private'}</span>
                    </div>
                    <div class="resume-preview">
                        <strong>${resume.header?.name || 'No Name'}</strong> - ${resume.header?.role || 'No Role'}<br>
                        ${(resume.professionalSummary || 'No summary').substring(0, 150)}...
                        <br><br>
                        <strong>Skills:</strong> ${(resume.skills || []).slice(0, 5).join(', ')}
                        ${resume.skills?.length > 5 ? ` (+${resume.skills.length - 5} more)` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderRawData() {
            const container = document.getElementById('rawDataViewer');
            container.textContent = JSON.stringify(rawData, null, 2);
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = allUsers.length;
            document.getElementById('totalResumes').textContent = allResumes.length;
            document.getElementById('publicResumes').textContent = allResumes.filter(r => r.isPublic).length;
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
        }

        function toggleView(section) {
            const sections = ['usersSection', 'resumesSection', 'rawSection'];
            sections.forEach(s => {
                document.getElementById(s).classList.toggle('hidden', s !== section + 'Section');
            });
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Filter users
            const userCards = document.querySelectorAll('.user-card');
            userCards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
            
            // Filter resumes
            const resumeCards = document.querySelectorAll('.resume-card');
            resumeCards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        async function exportAllData() {
            try {
                const exportData = {
                    ...rawData,
                    exportedAt: new Date().toISOString(),
                    exportedBy: allUsers[0]?.email || 'Unknown'
                };

                const dataStr = JSON.stringify(exportData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `mongodb-export-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);

                showMessage('✅ Data exported successfully!', 'success');
            } catch (error) {
                showMessage(`❌ Export failed: ${error.message}`, 'error');
            }
        }

        function copyRawData() {
            const rawText = document.getElementById('rawDataViewer').textContent;
            navigator.clipboard.writeText(rawText).then(() => {
                showMessage('✅ Raw data copied to clipboard!', 'success');
            });
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            container.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
        });
    </script>
</body>
</html>
