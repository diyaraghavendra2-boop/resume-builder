<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    <div id="results"></div>
    
    <button onclick="testConnection()">Test Backend Connection</button>
    <button onclick="testCORS()">Test CORS</button>
    
    <script>
        const API_BASE = 'http://localhost:5001/api';
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testConnection() {
            try {
                addResult('Testing backend connection...', 'info');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                addResult(`✅ Backend connected: ${data.message}`, 'success');
            } catch (error) {
                addResult(`❌ Backend connection failed: ${error.message}`, 'error');
                addResult('Make sure backend is running on port 5001', 'error');
            }
        }
        
        async function testCORS() {
            try {
                addResult('Testing CORS policy...', 'info');
                const response = await fetch(`${API_BASE}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    addResult('✅ CORS is working correctly', 'success');
                } else {
                    addResult(`❌ CORS issue: ${response.status}`, 'error');
                }
            } catch (error) {
                if (error.message.includes('CORS')) {
                    addResult(`❌ CORS blocked: ${error.message}`, 'error');
                    addResult('Check backend CORS configuration', 'error');
                } else {
                    addResult(`❌ Request failed: ${error.message}`, 'error');
                }
            }
        }
        
        // Auto-test on load
        document.addEventListener('DOMContentLoaded', () => {
            testConnection();
        });
    </script>
</body>
</html>
