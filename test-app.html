<!DOCTYPE html>
<html>
<head>
    <title>Test Resume Builder</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Resume Builder Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // Test 1: Check if files exist
        addResult('Testing file accessibility...', 'info');
        
        fetch('index.html')
            .then(response => {
                if (response.ok) {
                    addResult('✅ index.html is accessible', 'success');
                } else {
                    addResult('❌ index.html not found', 'error');
                }
            })
            .catch(err => addResult('❌ Error accessing index.html: ' + err.message, 'error'));
            
        fetch('script.js')
            .then(response => {
                if (response.ok) {
                    addResult('✅ script.js is accessible', 'success');
                } else {
                    addResult('❌ script.js not found', 'error');
                }
            })
            .catch(err => addResult('❌ Error accessing script.js: ' + err.message, 'error'));
            
        fetch('styles.css')
            .then(response => {
                if (response.ok) {
                    addResult('✅ styles.css is accessible', 'success');
                } else {
                    addResult('❌ styles.css not found', 'error');
                }
            })
            .catch(err => addResult('❌ Error accessing styles.css: ' + err.message, 'error'));
            
        fetch('defaultResume.json')
            .then(response => {
                if (response.ok) {
                    addResult('✅ defaultResume.json is accessible', 'success');
                    return response.json();
                } else {
                    addResult('❌ defaultResume.json not found', 'error');
                }
            })
            .then(data => {
                if (data) {
                    addResult('✅ defaultResume.json is valid JSON', 'success');
                }
            })
            .catch(err => addResult('❌ Error with defaultResume.json: ' + err.message, 'error'));
            
        // Test 2: Check localStorage
        try {
            localStorage.setItem('test', 'value');
            localStorage.removeItem('test');
            addResult('✅ localStorage is working', 'success');
        } catch (err) {
            addResult('❌ localStorage error: ' + err.message, 'error');
        }
        
        addResult('🔗 Main app: http://localhost:8000/index.html', 'info');
    </script>
</body>
</html>
