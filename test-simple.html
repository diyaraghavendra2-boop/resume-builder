<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder - Working Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: #007acc; color: white; padding: 20px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        .panel { background: white; padding: 20px; flex: 1; border-radius: 5px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; }
        button { background: #007acc; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .preview { background: #007acc; color: white; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✅ Resume Builder - Working!</h1>
        <p>If you can see this, the deployment is working!</p>
    </div>
    
    <div class="container">
        <div class="panel">
            <h2>Edit Your Resume</h2>
            <input type="text" id="name" placeholder="Your Name" onkeyup="updatePreview()">
            <input type="text" id="job" placeholder="Job Title" onkeyup="updatePreview()">
            <input type="email" id="email" placeholder="Email" onkeyup="updatePreview()">
            <textarea id="summary" placeholder="Professional Summary" onkeyup="updatePreview()"></textarea>
            <button onclick="saveResume()">💾 Save</button>
            <button onclick="window.print()">🖨️ Print</button>
        </div>
        
        <div class="panel">
            <h2>Live Preview</h2>
            <div class="preview">
                <h1 id="preview-name">Your Name</h1>
                <h3 id="preview-job">Job Title</h3>
                <p id="preview-email">your@email.com</p>
            </div>
            <p id="preview-summary">Your professional summary will appear here...</p>
        </div>
    </div>

    <script>
        function updatePreview() {
            document.getElementById('preview-name').textContent = 
                document.getElementById('name').value || 'Your Name';
            document.getElementById('preview-job').textContent = 
                document.getElementById('job').value || 'Job Title';
            document.getElementById('preview-email').textContent = 
                document.getElementById('email').value || 'your@email.com';
            document.getElementById('preview-summary').textContent = 
                document.getElementById('summary').value || 'Your professional summary will appear here...';
        }
        
        function saveResume() {
            alert('✅ Resume saved! (This is working!)');
        }
        
        console.log('✅ Resume builder loaded successfully!');
    </script>
</body>
</html>
