<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Resume Builder</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Resume Builder Debug</h1>
        <p>This page helps diagnose issues with the resume builder.</p>
        
        <div id="status"></div>
        
        <button onclick="testAPI()">Test API Connection</button>
        <button onclick="testFiles()">Test File Loading</button>
        <button onclick="testAuth()">Test Authentication</button>
        <button onclick="goToMain()">Go to Main App</button>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'https://resume-indol-sigma.vercel.app/api';
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }
        
        async function testAPI() {
            addResult('🧪 Testing API connection...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.status === 'OK') {
                    addResult('✅ API Health Check: SUCCESS', 'success');
                    addResult(`📊 Response: ${JSON.stringify(data)}`, 'info');
                } else {
                    addResult('❌ API Health Check: FAILED', 'error');
                    addResult(`📊 Response: ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ API Connection Error: ${error.message}`, 'error');
            }
        }
        
        async function testFiles() {
            addResult('🧪 Testing file loading...', 'info');
            
            // Test config.js
            try {
                const configResponse = await fetch('/config.js');
                if (configResponse.ok) {
                    addResult('✅ config.js: LOADED', 'success');
                } else {
                    addResult('❌ config.js: FAILED TO LOAD', 'error');
                }
            } catch (error) {
                addResult(`❌ config.js Error: ${error.message}`, 'error');
            }
            
            // Test script.js
            try {
                const scriptResponse = await fetch('/script.js');
                if (scriptResponse.ok) {
                    addResult('✅ script.js: LOADED', 'success');
                } else {
                    addResult('❌ script.js: FAILED TO LOAD', 'error');
                }
            } catch (error) {
                addResult(`❌ script.js Error: ${error.message}`, 'error');
            }
            
            // Test styles.css
            try {
                const styleResponse = await fetch('/styles.css');
                if (styleResponse.ok) {
                    addResult('✅ styles.css: LOADED', 'success');
                } else {
                    addResult('❌ styles.css: FAILED TO LOAD', 'error');
                }
            } catch (error) {
                addResult(`❌ styles.css Error: ${error.message}`, 'error');
            }
        }
        
        async function testAuth() {
            addResult('🧪 Testing authentication endpoints...', 'info');
            
            // Test register endpoint
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Debug Test User',
                        email: `debug${Date.now()}@test.com`,
                        password: 'testpass123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addResult('✅ Registration Endpoint: WORKING', 'success');
                    addResult(`📊 User Created: ${data.data.user.name}`, 'info');
                } else {
                    addResult(`⚠️ Registration Response: ${data.message}`, 'info');
                }
            } catch (error) {
                addResult(`❌ Registration Error: ${error.message}`, 'error');
            }
        }
        
        function goToMain() {
            window.location.href = '/index.html';
        }
        
        // Auto-run basic tests
        window.onload = function() {
            addResult('🚀 Debug page loaded successfully', 'success');
            addResult(`🌐 Current URL: ${window.location.href}`, 'info');
            addResult(`📡 API Base: ${API_BASE}`, 'info');
        };
    </script>
</body>
</html>
