<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced MongoDB Viewer - User-Resume Relationships</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #334155; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%); color: white; padding: 24px; border-radius: 12px; margin-bottom: 24px; text-align: center; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); text-align: center; }
        .stat-number { font-size: 32px; font-weight: 700; color: #6366f1; margin-bottom: 8px; }
        .stat-label { color: #64748b; font-weight: 500; }
        .section { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
        .section-header { padding: 20px; border-bottom: 1px solid #e2e8f0; font-size: 18px; font-weight: 600; color: #1e293b; }
        .section-content { padding: 20px; }
        .user-resume-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .user-info { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
        .resume-list { margin-left: 20px; }
        .resume-item { background: #f8fafc; padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #6366f1; }
        .resume-name { font-weight: 600; color: #1e293b; }
        .resume-meta { font-size: 12px; color: #64748b; margin-top: 4px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .error { background: #fef2f2; color: #dc2626; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 User-Resume Relationships</h1>
            <p>See which user created which resume</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalResumes">-</div>
                <div class="stat-label">Total Resumes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">-</div>
                <div class="stat-label">Users with Resumes</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                👥 User-Resume Relationships
                <button onclick="loadData()" class="btn btn-primary" style="float: right;">🔄 Refresh</button>
            </div>
            <div class="section-content" id="userResumeContent">
                <div class="loading">Loading user-resume relationships...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/api';
        let userData = {};

        async function loadData() {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    document.getElementById('userResumeContent').innerHTML = 
                        '<div class="error">Please login first to view data</div>';
                    return;
                }

                // Load current user info
                const userResponse = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const currentUser = await userResponse.json();

                // Load resumes
                const resumeResponse = await fetch(`${API_BASE}/resume`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const resumeData = await resumeResponse.json();

                if (currentUser.success && resumeData.success) {
                    displayUserResumeRelationships(currentUser.data.user, resumeData.data.resumes);
                    updateStats(1, resumeData.data.resumes.length, 1);
                } else {
                    throw new Error('Failed to load data');
                }
            } catch (error) {
                document.getElementById('userResumeContent').innerHTML = 
                    `<div class="error">Failed to load data: ${error.message}</div>`;
            }
        }

        function displayUserResumeRelationships(user, resumes) {
            const container = document.getElementById('userResumeContent');
            
            // Group resumes by creation date
            const sortedResumes = resumes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            container.innerHTML = `
                <div class="user-resume-card">
                    <div class="user-info">
                        <strong>👤 ${user.name}</strong>
                        <div style="font-size: 14px; opacity: 0.9;">${user.email}</div>
                        <div style="font-size: 12px; opacity: 0.8;">User ID: ${user.id}</div>
                        <div style="font-size: 12px; opacity: 0.8;">Joined: ${new Date(user.createdAt).toLocaleDateString()}</div>
                    </div>
                    
                    <div class="resume-list">
                        <h4 style="margin-bottom: 12px; color: #1e293b;">📋 Created Resumes (${resumes.length})</h4>
                        ${sortedResumes.map(resume => `
                            <div class="resume-item">
                                <div class="resume-name">
                                    ${resume.header?.name || 'Unnamed Resume'} 
                                    ${resume.title !== 'My Resume' ? `(${resume.title})` : ''}
                                </div>
                                <div class="resume-meta">
                                    📅 Created: ${new Date(resume.createdAt).toLocaleString()}
                                    | 📝 Updated: ${new Date(resume.updatedAt).toLocaleString()}
                                    | ${resume.isPublic ? '🌐 Public' : '🔒 Private'}
                                    | 🆔 ${resume._id}
                                </div>
                                <div class="resume-meta">
                                    💼 Role: ${resume.header?.role || 'Not specified'}
                                    | 🏷️ Skills: ${(resume.skills || []).slice(0, 3).join(', ')}${resume.skills?.length > 3 ? ` (+${resume.skills.length - 3} more)` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateStats(users, resumes, activeUsers) {
            document.getElementById('totalUsers').textContent = users;
            document.getElementById('totalResumes').textContent = resumes;
            document.getElementById('activeUsers').textContent = activeUsers;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
