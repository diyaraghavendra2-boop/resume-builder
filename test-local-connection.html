<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🧪 Local Connection Test</h1>
    <p>Testing connection between frontend (port 8000) and backend (port 5001)</p>
    
    <button onclick="testBackendHealth()">Test Backend Health</button>
    <button onclick="testRegistration()">Test Registration</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testResumes()">Test Resume API</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5001/api';
        const resultsDiv = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(div);
        }

        async function testBackendHealth() {
            try {
                addResult('Testing backend health...', 'info');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.status === 'OK') {
                    addResult('✅ Backend health check passed!', 'success');
                    addResult(`Backend message: ${data.message}`, 'info');
                } else {
                    addResult('❌ Backend health check failed', 'error');
                }
            } catch (error) {
                addResult(`❌ Backend connection failed: ${error.message}`, 'error');
            }
        }

        async function testRegistration() {
            try {
                addResult('Testing user registration...', 'info');
                const testUser = {
                    name: 'Test User Local',
                    email: `test${Date.now()}@example.com`,
                    password: 'testpass123'
                };

                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testUser)
                });

                const data = await response.json();
                
                if (data.success) {
                    addResult('✅ User registration successful!', 'success');
                    addResult(`User ID: ${data.user.id}`, 'info');
                    window.testToken = data.token; // Store for other tests
                } else {
                    addResult(`⚠️ Registration response: ${data.message}`, 'info');
                }
            } catch (error) {
                addResult(`❌ Registration failed: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            try {
                addResult('Testing user login...', 'info');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'testpass123'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    addResult('✅ Login successful!', 'success');
                    window.testToken = data.token;
                } else {
                    addResult(`⚠️ Login response: ${data.message}`, 'info');
                }
            } catch (error) {
                addResult(`❌ Login failed: ${error.message}`, 'error');
            }
        }

        async function testResumes() {
            try {
                addResult('Testing resume API...', 'info');
                
                if (!window.testToken) {
                    addResult('⚠️ No auth token available. Try registration or login first.', 'info');
                    return;
                }

                const response = await fetch(`${API_BASE}/resume`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${window.testToken}`
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    addResult(`✅ Resume API working! Found ${data.resumes.length} resumes`, 'success');
                } else {
                    addResult(`⚠️ Resume API response: ${data.message}`, 'info');
                }
            } catch (error) {
                addResult(`❌ Resume API failed: ${error.message}`, 'error');
            }
        }

        // Auto-run health check on page load
        window.onload = () => {
            addResult('🚀 Starting local connection tests...', 'info');
            testBackendHealth();
        };
    </script>
</body>
</html>
